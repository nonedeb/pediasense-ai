<form method="POST" enctype="multipart/form-data" class="mb-3">

<select name="user_type" class="form-select mb-2" required>
  <option value="">Select Type</option>
  <option value="student">Student</option>
  <option value="faculty">Faculty</option>
</select>

<input type="file" name="file" class="form-control mb-2">
<button class="btn btn-primary">Preview</button>

</form>

{% if preview %}
<form method="POST" action="/import-confirm">
  <input type="hidden" name="raw_data" value="{{ request.files['file'].read().decode('utf-8') }}">
  <input type="hidden" name="user_type" value="{{ user_type }}">

  <button class="btn btn-success mb-3">Confirm Import</button>
</form>

<table class="table">
<tr><th>Name</th><th>Email</th><th>Status</th></tr>

{% for row in preview %}
<tr>
<td>{{ row.row.name }}</td>
<td>{{ row.row.email }}</td>
<td>
  {% if row.errors %}
    <span class="text-danger">{{ row.errors }}</span>
  {% else %}
    <span class="text-success">OK</span>
  {% endif %}
</td>
</tr>
{% endfor %}

</table>
{% endif %}
