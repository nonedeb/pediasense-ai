{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Reference Documents</h2>
<div class="card border-0 shadow-sm rounded-4 mb-4">
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-5"><label class="form-label">Title</label><input name="title" class="form-control rounded-3" required></div>
      <div class="col-md-3"><label class="form-label">Edition</label><input name="edition" class="form-control rounded-3"></div>
      <div class="col-md-4"><label class="form-label">File Path / URL</label><input name="file_path" class="form-control rounded-3" placeholder="uploads/nanda.pdf"></div>
      <div class="col-12"><button class="btn btn-primary rounded-3">Save Document</button></div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body">
    <table class="table table-hover">
      <thead><tr><th>Title</th><th>Edition</th><th>File</th><th>Active</th></tr></thead>
      <tbody>
        {% for doc in docs %}
        <tr><td>{{ doc.title }}</td><td>{{ doc.edition or '-' }}</td><td>{{ doc.file_name }}</td><td>{{ 'Yes' if doc.is_active else 'No' }}</td></tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted">No documents uploaded yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
