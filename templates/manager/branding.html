{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Branding Settings</h2>
<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-6"><label class="form-label">Site Name</label><input name="site_name" class="form-control rounded-3" value="{{ settings.site_name }}"></div>
      <div class="col-md-6"><label class="form-label">Logo URL</label><input name="logo_url" class="form-control rounded-3" value="{{ settings.logo_url or '' }}"></div>
      <div class="col-12"><button class="btn btn-primary rounded-3">Save Branding</button></div>
    </form>
  </div>
</div>
{% endblock %}
