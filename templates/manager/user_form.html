{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">{{ 'Create User' if mode == 'create' else 'Edit User' }}</h2>
<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control rounded-3" value="{{ user.name if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control rounded-3" value="{{ user.email if user else '' }}" required></div>
      <div class="col-md-4"><label class="form-label">Role</label><select name="role" class="form-select rounded-3" required>{% set rv = user.role if user else '' %}<option value="student" {% if rv=='student' %}selected{% endif %}>Student</option><option value="faculty" {% if rv=='faculty' %}selected{% endif %}>Faculty</option><option value="manager" {% if rv=='manager' %}selected{% endif %}>Manager</option></select></div>
      <div class="col-md-4"><label class="form-label">Section</label><input name="section" class="form-control rounded-3" value="{{ user.section if user else '' }}"></div>
      <div class="col-md-4"><label class="form-label">Program</label><input name="program" class="form-control rounded-3" value="{{ user.program if user else '' }}"></div>
      <div class="col-md-4"><label class="form-label">Specialization</label><input name="specialization" class="form-control rounded-3" value="{{ user.specialization if user else '' }}"></div>
      <div class="col-md-4"><label class="form-label">Post-nominals</label><input name="post_nominals" class="form-control rounded-3" value="{{ user.post_nominals if user else '' }}"></div>
      <div class="col-md-4"><label class="form-label">Contact Number</label><input name="contact_number" class="form-control rounded-3" value="{{ user.contact_number if user else '' }}"></div>
      <div class="col-md-4"><label class="form-label">Status</label>{% set sv = user.status if user else 'active' %}<select name="status" class="form-select rounded-3"><option value="active" {% if sv=='active' %}selected{% endif %}>Active</option><option value="inactive" {% if sv=='inactive' %}selected{% endif %}>Inactive</option></select></div>
      <div class="col-md-4"><label class="form-label">Password {% if mode == 'edit' %}(optional){% endif %}</label><input name="password" type="password" class="form-control rounded-3"></div>
      <div class="col-12"><button class="btn btn-primary rounded-3">{{ 'Create User' if mode == 'create' else 'Save Changes' }}</button> <a href="{{ url_for('manager_users') }}" class="btn btn-outline-secondary rounded-3">Cancel</a></div>
    </form>
  </div>
</div>
{% endblock %}
