
{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card rounded-4 shadow-sm">
      <div class="card-body p-4">
        <h2 class="fw-bold mb-3">Create Account</h2>
        <form method="post" class="row g-3">
          <div class="col-md-12"><label class="form-label">Full Name</label><input class="form-control" name="full_name" required></div>
          <div class="col-md-12"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
          <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div>
          <div class="col-md-6"><label class="form-label">Section</label><input class="form-control" name="section"></div>
          <div class="col-md-12">
            <label class="form-label">Role</label>
            <select class="form-select" name="role">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
            <div class="form-text">Manager accounts are created only by the manager panel.</div>
          </div>
          <div class="col-12"><button class="btn btn-primary w-100">Register</button></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
