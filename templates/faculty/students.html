{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Students</h2>
<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body">
    <table class="table table-hover">
      <thead><tr><th>Name</th><th>Email</th><th>Section</th><th>Program</th><th>Contact</th></tr></thead>
      <tbody>
        {% for s in students %}
        <tr><td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.section or '-' }}</td><td>{{ s.program or '-' }}</td><td>{{ s.contact_number or '-' }}</td></tr>
        {% else %}
        <tr><td colspan="5" class="text-center text-muted">No students found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
