{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Analytics</h2>
<div class="row g-4">
  <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Students</div><div class="fs-2 fw-bold">{{ total_students }}</div></div></div></div>
  <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Quiz Attempts</div><div class="fs-2 fw-bold">{{ total_quiz_attempts }}</div></div></div></div>
  <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Avg Accuracy</div><div class="fs-2 fw-bold">{{ avg_accuracy }}%</div></div></div></div>
  <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Avg Case Score</div><div class="fs-2 fw-bold">{{ avg_case_score }}</div></div></div></div>
</div>
{% endblock %}
