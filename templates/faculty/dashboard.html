{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Faculty Dashboard</h2>
<div class="row g-4">
  <div class="col-md-4"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Total Students</div><div class="fs-2 fw-bold">{{ total_students }}</div></div></div></div>
  <div class="col-md-4"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Quiz Attempts</div><div class="fs-2 fw-bold">{{ total_quiz_attempts }}</div></div></div></div>
  <div class="col-md-4"><div class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="text-muted">Case Attempts</div><div class="fs-2 fw-bold">{{ total_case_attempts }}</div></div></div></div>
</div>
{% endblock %}
